appId: com.dshlauncher.app
productName: DSH Launcher
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  executableName: DSHLauncher
  target:
    - target: nsis
      arch:
        - x64
publish:
  provider: github
  owner: zhanweipan
  repo: dsh-launcher
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH Launcher
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}