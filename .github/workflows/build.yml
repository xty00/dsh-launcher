name: Build & Release

# 触发方式：
#   1. 手动：Actions 页 → Run workflow
#   2. 自动（日常）：push 到 main → 自动打包并挂 artifact（不发布）
#   3. 自动（发版）：push v* tag → 自动打包并发正式 Release（含 latest.yml 支持自动更新）
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    # GITHUB_TOKEN 默认只有 contents:read，发 Release 需要 write 权限
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build (electron-vite)
        run: npm run build

      # 打包（注意：electron-builder.yml 里配了 publish，tag 构建会默认 onTagOrDraft 发布，
      # 必须显式 --publish never，否则会与下方 Publish 步骤重复发布、产生重复 Release）
      - name: Package NSIS installer
        run: npx electron-builder --win --publish never --config.publish.owner=xty00 --config.publish.repo=dsh-launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Launcher-Setup
          path: dist/*.exe
          if-no-files-found: error

      # 仅 tag 触发时发布 GitHub Release（含 latest.yml，用户可自动更新）
      - name: Publish GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win --publish always --config.publish.owner=xty00 --config.publish.repo=dsh-launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
