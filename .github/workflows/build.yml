name: Build & Release

# 触发方式：
#   1. 手动：Actions 页 → Run workflow
#   2. 自动（日常）：push 到 main → 自动打包并挂 artifact（不发布）
#   3. 自动（发版）：push v* tag → 自动打包并发正式 Release（含 latest.yml 支持自动更新）
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build (electron-vite)
        run: npm run build

      # 覆盖 electron-builder.yml 中的 publish.owner/repo，让 Release 发到本 fork
      # （yml 里 publish.releaseType: release 保证发正式 Release，自动更新可解析 latest.yml）
      # 注意：必须用长格式 --config.publish.*（短格式 -c.publish.* 会被解析成配置文件路径）
      - name: Package NSIS installer
        run: npx electron-builder --win --config.publish.owner=xty00 --config.publish.repo=dsh-launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Launcher-Setup
          path: dist/*.exe
          if-no-files-found: error

      # 仅 tag 触发时发布 GitHub Release（含 latest.yml，用户可自动更新）
      - name: Publish GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win --publish always --config.publish.owner=xty00 --config.publish.repo=dsh-launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
